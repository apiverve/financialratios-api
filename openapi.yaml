openapi: 3.0.4
info:
  title: Financial Ratios
  description: >-
    Financial Ratios returns the key profitability, liquidity, leverage,
    efficiency and cash-flow ratios for a US public company by ticker - margins,
    ROE, ROA, current ratio, debt-to-equity, interest coverage, asset turnover,
    FCF margin and more - all computed from SEC filing data. On paid plans,
    valuation=true adds market cap, P/E, P/S, P/B and earnings yield against the
    latest stored share price.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/financialratios:
    get:
      summary: Financial Ratios
      description: >-
        Get the key financial ratios for a company by ticker symbol. Optionally
        filter to a specific fiscal year and quarter, or add valuation=true for
        market cap, P/E, P/S, P/B and earnings yield on the latest filing (paid
        plans; free plans get the block back null).
      operationId: financialratios
      parameters:
        - name: ticker
          in: query
          schema:
            type: string
          required: true
          description: Stock ticker symbol (e.g. AAPL, MSFT, ADBE)
          example: AAPL
        - name: year
          in: query
          schema:
            type: integer
          required: false
          description: >-
            Fiscal year to retrieve. Defaults to latest available. History
            covers only the quarters captured so far; a missing period answers
            404 listing the available ones.
        - name: quarter
          in: query
          schema:
            type: integer
          required: false
          description: Fiscal quarter to retrieve. Defaults to latest available.
        - name: valuation
          in: query
          schema:
            type: boolean
          required: false
          description: >-
            Add a valuation block: market cap, P/E, earnings yield, P/S and P/B
            against the latest stored share price, with the
            trailing-twelve-month EPS, revenue and net income behind them.
            Latest filing only; null for a year/quarter request. The block is
            paid; free plans get it back null.
          example: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  ticker: COST
                  company: COSTCO WHOLESALE CORP /NEW
                  cik: '0000909832'
                  fiscalYear: 2026
                  fiscalQuarter: 4
                  filingType: 10-K
                  filingDate: '2026-10-07'
                  periodEnd: '2026-08-30'
                  profitability:
                    grossMargin: null
                    operatingMargin: 3.85
                    netMargin: 3.04
                    returnOnEquity: 25.77
                    returnOnAssets: 10.36
                  liquidity:
                    currentRatio: 1.06
                    quickRatio: 0.62
                    cashRatio: 0.46
                  leverage:
                    debtToEquity: 1.49
                    debtToAssets: 0.6
                    equityMultiplier: 2.49
                    interestCoverage: 80.59
                  efficiency:
                    assetTurnover: 3.4
                    inventoryTurnover: 13.68
                    receivablesTurnover: null
                  cashFlow:
                    freeCashFlow: 9382000000
                    fcfMargin: 3.09
                    operatingCashFlowMargin: 5.22
                    capexToRevenue: 2.12
                  perShare:
                    eps: 20.76
                    bookValuePerShare: 80.5599
                    freeCashFlowPerShare: 21.1103
                  valuation:
                    priceAsOf: '2026-11-05T21:00:00.000Z'
                    marketCap: 473576966930
                    priceToEarnings: 51.33
                    earningsYield: 1.95
                    priceToSales: 1.56
                    priceToBook: 13.23
                    trailingEps: 20.76
                    trailingRevenue: 303154000000
                    trailingNetIncome: 9226000000
                    trailingBasis: annual
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
