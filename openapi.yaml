openapi: 3.0.4
info:
  title: Financial Ratios
  description: >-
    Financial Ratios returns the key profitability, liquidity, leverage,
    efficiency and cash-flow ratios for a US public company by ticker - margins,
    ROE, ROA, current ratio, debt-to-equity, interest coverage, asset turnover,
    FCF margin and more - all computed from SEC filing data.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/financialratios:
    get:
      summary: Financial Ratios
      description: >-
        Get the key financial ratios for a company by ticker symbol. Optionally
        filter to a specific fiscal year and quarter.
      operationId: financialratios
      parameters:
        - name: ticker
          in: query
          schema:
            type: string
          required: true
          description: Stock ticker symbol (e.g. AAPL, MSFT, ADBE)
          example: AAPL
        - name: year
          in: query
          schema:
            type: integer
          required: false
          description: >-
            Fiscal year to retrieve. Defaults to latest available. History
            covers only the quarters captured so far; a missing period answers
            404 listing the available ones.
        - name: quarter
          in: query
          schema:
            type: integer
          required: false
          description: Fiscal quarter to retrieve. Defaults to latest available.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  ticker: AAPL
                  company: Apple Inc.
                  cik: '0000320193'
                  fiscalYear: 2025
                  fiscalQuarter: 4
                  filingType: 10-K
                  filingDate: '2025-10-31'
                  periodEnd: '2025-09-27'
                  profitability:
                    grossMargin: 46.91
                    operatingMargin: 31.97
                    netMargin: 26.92
                    returnOnEquity: 151.91
                    returnOnAssets: 31.18
                  liquidity:
                    currentRatio: 0.89
                    quickRatio: 0.86
                    cashRatio: 0.22
                  leverage:
                    debtToEquity: 3.87
                    debtToAssets: 0.79
                    equityMultiplier: 4.87
                    interestCoverage: null
                  efficiency:
                    assetTurnover: 1.16
                    inventoryTurnover: 38.64
                    receivablesTurnover: 10.46
                  cashFlow:
                    freeCashFlow: 98767000000
                    fcfMargin: 23.73
                    operatingCashFlowMargin: 26.79
                    capexToRevenue: 3.06
                  perShare:
                    eps: 7.46
                    bookValuePerShare: 4.914
                    freeCashFlowPerShare: 6.5824
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
